<div id="article"><section style="max-width:677px;margin:0 auto;padding:8px 16px;box-sizing:border-box;background:#ffffff;color:#383838;font-family:"PingFang SC NEW",system-ui,-apple-system,"Helvetica Neue","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif;line-height:1.75;"><section style="margin:0 10px 34px;padding:26px 10px 4px;"><section style="margin:0 0 18px;line-height:1;"><span style="display:inline-block;background:#F0E4E4;color:#6E5353;border-radius:980px;padding:4px 10px;font-size:11px;line-height:1.4;margin:0 6px 0 0;"><span leaf="">【请改成你的公众号名称】</span></span><span style="display:inline-block;background:#F4ECD7;color:#6E6248;border-radius:980px;padding:4px 10px;font-size:11px;line-height:1.4;margin:0;"><span leaf="">副标签</span></span></section><h1 style="margin:0 0 26px;font-size:29px;line-height:1.34;font-weight:780;letter-spacing:-0.02em;color:#383838;background-image:linear-gradient(90deg,#2d2d2d 0%,#6e6248 58%,#a89090 100%);background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;"><span leaf="">文章标题</span></h1><section style="width:64px;height:4px;margin:0 0 26px;border-radius:980px;background-color:#CFB7B7;"></section></section><section style="display:flex;align-items:center;margin:18px 0 20px;padding-bottom:14px;border-bottom:3px solid #CFB7B7;"><span style="display:inline-block;background-color:#A89090;background-image:linear-gradient(135deg,#8f7373 0%,#cfb7b7 100%);color:#F4ECD7;font-size:18px;font-weight:900;padding:4px 14px;border-radius:6px;margin-right:14px;line-height:1.3;"><span leaf="">01</span></span><span style="min-width:0;"><p style="margin:0 0 2px;font-size:10px;font-weight:700;letter-spacing:0;color:#6E6248;"><span leaf="">ENGLISH LABEL</span></p><span style="display:block;font-size:18px;font-weight:800;line-height:1.5;color:#2F3840;background-image:linear-gradient(90deg,#2f3840 0%,#8f7373 58%,#cfb7b7 100%);background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;"><span leaf="">章节中文标题</span></span></span></section><section style="margin:0 0 20px;"><p style="margin:0;font-size:15px;line-height:1.85;text-align:justify;color:#383838;letter-spacing:0;"><span leaf="">这是正文演示段落，包含<span textstyle="" style="color:rgb(250,124,33);font-weight:600;">加粗强调</span>，还有<a href="https://example.com" style="color:rgb(250,124,33);text-decoration:underline;">链接</a>，还有<strong style="margin:0;padding:0 2px;font-weight:700;color:#6E6248;background-image:linear-gradient(transparent 62%,#e8d5d5 62%,#e8d5d5 90%,transparent 90%);background-repeat:no-repeat;">行内标记</strong>。</span></p></section><section style="margin:0 0 20px;"><p style="margin:0;font-size:15px;line-height:1.85;text-align:justify;color:#383838;letter-spacing:0;"><span leaf="">• 列表项一，可含<span textstyle="" style="color:rgb(250,124,33);font-weight:600;">加粗</span></span></p></section><section style="margin:0 0 20px;"><p style="margin:0;font-size:15px;line-height:1.85;text-align:justify;color:#383838;letter-spacing:0;"><span leaf="">• 列表项二</span></p></section><section style="text-align:center;margin:0 0 8px;"><span leaf=""><img src="https://placehold.co/600x400?text=Demo" style="max-width:100%;height:auto;display:block;margin:0 auto;" /></span></section><p style="margin:10px 0 20px;font-size:11px;line-height:1.65;text-align:center;color:#888888;"><span leaf="">图注文字</span></p><section style="text-align:center;margin:28px 0 30px;"><span leaf=""><img src="https://placehold.co/600x400?text=Demo" style="max-width:100%;height:auto;display:block;margin:0 auto;border-radius:12px;" /></span></section><p style="margin:10px 0 20px;font-size:11px;line-height:1.65;text-align:center;color:#888888;"><span leaf="">图注文字</span></p><section style="text-align:center;margin:28px 0 16px;"><p style="margin:0;font-size:16px;letter-spacing:0;"><span leaf="">—The End—</span></p></section><p style="margin:0 0 18px;font-size:14px;line-height:1.85;text-align:center;color:rgb(102,102,102);"><span leaf="">一句致谢（可省略）</span></p></section></div>
<script>
function copyArticle(){
  var node=document.getElementById('article'), tip=document.getElementById('tip');
  function ok(){ tip.textContent='已复制！现在去公众号后台 Ctrl+V'; tip.style.color='#1a9e54'; }
  function fail(){ tip.textContent='复制失败，请手动选中正文复制'; tip.style.color='#d33'; }
  if(navigator.clipboard&&window.ClipboardItem){
    var data=new ClipboardItem({
      'text/html':new Blob([node.innerHTML],{type:'text/html'}),
      'text/plain':new Blob([node.innerText],{type:'text/plain'})
    });
    navigator.clipboard.write([data]).then(ok).catch(selectFallback);
  } else { selectFallback(); }
  function selectFallback(){
    var range=document.createRange(); range.selectNodeContents(node);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    try{ document.execCommand('copy')?ok():fail(); }catch(e){ fail(); }
  }
}
</script>
