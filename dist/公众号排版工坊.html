<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>公众号排版工坊 · 离线版</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f1f3f6; color: #1f2937; display: flex; flex-direction: column; }
  header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 9px 14px;
           display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
  header .brand { font-weight: 800; font-size: 15px; margin-right: 6px; }
  select, button, .file-btn { font-size: 13px; border: 1px solid #d1d5db; background: #fff;
           color: #1f2937; border-radius: 7px; padding: 6px 11px; cursor: pointer; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 700; }
  button:hover, select:hover, .file-btn:hover { border-color: #93c5fd; }
  #status { font-size: 12px; color: #6b7280; margin-left: auto; }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane h3 { font-size: 12px; color: #6b7280; font-weight: 700; margin: 0; padding: 7px 12px;
             background: #fafbfc; border-bottom: 1px solid #e5e7eb; }
  #editor { flex: 1; width: 100%; border: none; outline: none; resize: none; padding: 14px;
            font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 13px;
            line-height: 1.7; background: #fff; color: #1f2937; }
  .divider-v { width: 1px; background: #e5e7eb; }
  #preview { flex: 1; width: 100%; border: none; background: #f1f3f6; }
  #copySrc { position: fixed; left: -99999px; top: 0; width: 677px; }
</style>
</head>
<body>
<header>
  <span class="brand">公众号排版工坊</span>
  <select id="sampleSel" title="载入内置示例"></select>
  <select id="themeSel" title="选择主题"></select>
  <button class="primary" id="renderBtn">渲染</button>
  <button id="copyBtn">一键复制</button>
  <button id="downloadBtn">下载 HTML</button>
  <span id="status">就绪</span>
</header>
<main>
  <section class="pane">
    <h3>Markdown / 模块源稿</h3>
    <textarea id="editor" spellcheck="false"></textarea>
  </section>
  <div class="divider-v"></div>
  <section class="pane">
    <h3>预览</h3>
    <iframe id="preview" title="预览"></iframe>
  </section>
</main>
<div id="copySrc"></div>

<script>
/* ===== inlined: core.js ===== */
/* ============================================================
 * wx-layout 浏览器内核 core.js（wx_core.py 的忠实 JS 移植）
 * 纯标准浏览器环境、离线、无依赖。负责：
 *   解析 md/:::模块 → IR；leaf/inline 微信适配；主题路由与 fallback；渲染。
 * 主题通过 window.WX_THEMES 注册（见 themes/*.js）。
 * ============================================================ */
(function (global) {
  "use strict";

  var DEFAULT_CONTAINERS = ["issue", "quote", "author", "card", "gallery", "callout",
    "faq", "timeline", "compare", "steps", "highlights", "profile", "toc", "stats",
    "keyvalue", "note", "tip", "warning", "code", "table", "cta", "audio"];
  var SINGLETON_ROLES = ["part", "sub", "shot", "video", "end", "divider", "image"];

  /* ---------- HTML 转义（对应 Python html.escape） ---------- */
  function esc(s, quote) {
    s = String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    if (quote) s = s.replace(/"/g, "&quot;");
    return s;
  }

  /* ---------- IR Block ---------- */
  function Block(role, pos, kw, bodyLines, bullet) {
    this.role = role;
    this.pos = pos || [];
    this.kw = kw || {};
    this.bodyLines = bodyLines || [];
    this.bullet = !!bullet;
    this.blocks = [];
    this.fields = {};
  }
  Block.prototype.get = function (i, d) {
    return i < this.pos.length ? this.pos[i] : (d === undefined ? "" : d);
  };

  /* ---------- 正则 ---------- */
  var IMG_RE = /^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/;
  var HEADING_RE = /^(#{1,6})\s+(.*)$/;
  var URL_RE = /^(https?:\/\/\S+|[\w\-./\\]+\.(?:png|jpe?g|gif|webp|bmp))\s*$/i;
  var LINK_RE_G = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)/g;
  var LINK_ONLY_RE = /^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)\s*$/;
  var LIST_LINE_RE = /^\s*[-*]\s+/;

  /* ---------- body 元素解析 ---------- */
  function parseBodyElements(lines) {
    var elements = [];
    var paras = [], buf = [];
    lines.concat([""]).forEach(function (ln) {
      if (ln.trim() === "") {
        if (buf.length) { paras.push(buf); buf = []; }
      } else buf.push(ln);
    });
    if (buf.length) paras.push(buf);

    paras.forEach(function (plines) {
      if (plines.every(function (x) { return LIST_LINE_RE.test(x); })) {
        var items = plines.map(function (x) {
          return x.replace(LIST_LINE_RE, "").trim();
        });
        elements.push({ type: "list", items: items });
        return;
      }
      plines.forEach(function (x) {
        var s = x.trim(), m;
        m = s.match(IMG_RE);
        if (m) { elements.push({ type: "image", alt: m[1], src: m[2] }); return; }
        m = s.match(HEADING_RE);
        if (m) { elements.push({ type: "heading", level: m[1].length, text: m[2].trim() }); return; }
        if (URL_RE.test(s)) { elements.push({ type: "image", alt: "", src: s }); return; }
        m = s.match(LINK_ONLY_RE);
        if (m) { elements.push({ type: "link", text: m[1], href: m[2] }); return; }
        elements.push({ type: "para", text: s });
      });
    });

    var links = [];
    elements.forEach(function (e) {
      if (e.type === "link") links.push({ text: e.text, href: e.href });
      if (e.type === "para") {
        var g, re = new RegExp(LINK_RE_G.source, "g");
        while ((g = re.exec(e.text)) !== null)
          links.push({ text: g[1], href: g[2] });
      }
    });
    var fields = {
      images: elements.filter(function (e) { return e.type === "image"; }).map(function (e) { return e.src; }),
      paras: elements.filter(function (e) { return e.type === "para"; }).map(function (e) { return e.text; }),
      headings: elements.filter(function (e) { return e.type === "heading"; }).map(function (e) { return e.text; }),
      lists: elements.filter(function (e) { return e.type === "list"; }).map(function (e) { return e.items; }),
      links: links
    };
    fields.image = fields.images[0] || "";
    fields.link = fields.links[0] ? fields.links[0].href : "";
    fields.heading = fields.headings[0] || "";
    return [elements, fields];
  }

  /* ---------- 指令头解析 ---------- */
  function parseHead(head) {
    var pos = [], kw = {};
    head.split("|").map(function (x) { return x.trim(); }).forEach(function (part) {
      if (!part) return;
      var m = part.match(/^([A-Za-z_][\w\-]*)\s*=\s*(.+)$/);
      if (m) kw[m[1]] = m[2].trim();
      else pos.push(part);
    });
    return [pos, kw];
  }

  /* ---------- 顶层解析 ---------- */
  function parse(mdText, containers) {
    mdText = mdText.replace(/<!--[\s\S]*?-->/g, "");  // 剥离 HTML 注释
    var lines = mdText.split(/\r?\n/);
    var out = [], i = 0;
    while (i < lines.length) {
      var s = lines[i].trim();
      if (!s) { i++; continue; }

      if (s.indexOf(":::") !== 0) {
        var buf = [];
        while (i < lines.length && lines[i].trim().indexOf(":::") !== 0) {
          buf.push(lines[i]); i++;
        }
        var text = buf.join("\n");
        var chunks = text.split(/\n\s*\n/).map(function (p) { return p.trim(); })
          .filter(function (p) { return p; });
        chunks.forEach(function (chunk) {
          var clines = chunk.split("\n").filter(function (ln) { return ln.trim(); });
          var items = clines.filter(function (ln) { return LIST_LINE_RE.test(ln); });
          if (items.length && items.length === clines.length) {
            items.forEach(function (it) {
              var b = new Block("para", null, null, null, true);
              var pf = parseBodyElements([it]);
              b.blocks = pf[0]; b.fields = pf[1];
              b.fields.text = it.replace(LIST_LINE_RE, "").trim();
              out.push(b);
            });
          } else {
            var b = new Block("para");
            var pf = parseBodyElements(clines);
            b.blocks = pf[0]; b.fields = pf[1];
            b.fields.text = clines.map(function (x) { return x.trim(); }).join(" ");
            out.push(b);
          }
        });
        continue;
      }

      var m = s.match(/^:::([A-Za-z_][\w\-]*)\s*(.*)$/);
      if (!m) { i++; continue; }
      var role = m[1], head = m[2];
      var ph = parseHead(head), pos = ph[0], kw = ph[1];

      if (containers.indexOf(role) >= 0) {
        var body = [], j = i + 1;
        while (j < lines.length && lines[j].trim() !== ":::") {
          body.push(lines[j]); j++;
        }
        var b = new Block(role, pos, kw, body);
        var pf = parseBodyElements(body);
        b.blocks = pf[0]; b.fields = pf[1];
        out.push(b);
        i = j + 1;
      } else {
        out.push(new Block(role, pos, kw));
        i++;
      }
    }
    return out;
  }

  /* ---------- 渲染引擎 ---------- */
  function Engine(theme) {
    this.theme = theme;
    this.t = (theme.THEME.tokens) || {};
  }
  Engine.prototype.inline = function (text) {
    text = esc(text, false);
    var stash = {};
    function keep(frag) {
      var k = "\x00" + Object.keys(stash).length + "\x00";
      stash[k] = frag; return k;
    }
    var self = this;
    text = text.replace(/\*\*([^*]+)\*\*/g, function (mm, p1) {
      return keep('<span textstyle="" style="color:' +
        (self.t.BOLD_INK || "rgb(17,24,39)") + ';font-weight:600;">' + p1 + "</span>");
    });
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function (mm, p1, p2) {
      return keep('<a href="' + p2 + '" style="color:' +
        (self.t.BLUE || "#2563eb") + ';text-decoration:underline;">' + p1 + "</a>");
    });
    Object.keys(stash).forEach(function (k) { text = text.split(k).join(stash[k]); });
    return text;
  };
  Engine.prototype.leaf = function (text) {
    return '<span leaf="">' + this.inline(text) + "</span>";
  };
  Engine.prototype.escAttr = function (text) { return esc(text, true); };
  Engine.prototype.containers = function () {
    var extra = this.theme.THEME.containers || [];
    var set = {};
    DEFAULT_CONTAINERS.concat(extra).forEach(function (r) {
      if (SINGLETON_ROLES.indexOf(r) < 0) set[r] = 1;
    });
    return Object.keys(set);
  };
  Engine.prototype.render = function (mdText) {
    var blocks = parse(mdText, this.containers());
    var roles = this.theme.ROLES || {};
    var pieces = [];
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i], fn = roles[b.role];
      if (fn) pieces.push(fn(b, this));
      else if (this.theme.fallback) pieces.push(this.theme.fallback(b, this));
      else pieces.push(this.defaultFallback(b));
    }
    var t = this.t;
    return '<section style="max-width:677px;margin:0 auto;padding:8px 16px;box-sizing:border-box;' +
      'background:' + (t.PAGE_BG || "#ffffff") + ';color:' + (t.TEXT || "#374151") +
      ';font-family:' + (t.FONT || "") + ';line-height:1.75;">' + pieces.join("") + "</section>";
  };
  Engine.prototype.videoPlaceholder = function (b) {
    // 视频本身是素材库引用的播放框、无法用网页样式生成；但可放进卡片框：上方视频位（后台插入视频），
    // 下方保留标题/说明。粘贴后视频留在框内、下方文字不丢失。
    var title = (b.get && b.get(0)) || b.pos[0] || "";
    var desc = (b.get && b.get(1)) || b.pos[1];
    var slot = '<section style="width:100%;aspect-ratio:16/9;min-height:180px;background:#0f172a;' +
      'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
      'text-align:center;padding:16px;box-sizing:border-box;">' +
      '<p style="margin:0;font-size:14px;font-weight:800;color:#e2e8f0;letter-spacing:0;">' +
      "▶ 视频位置｜在此插入视频</p>" +
      '<p style="margin:8px 0 0;font-size:11px;line-height:1.7;color:#94a3b8;letter-spacing:0;">' +
      "将光标放本框，点后台工具栏「视频」，从素材库上传/选择对应视频，替换本提示。</p></section>";
    var cap = "";
    if (title) cap += '<p style="margin:12px 14px 0;font-size:14px;font-weight:800;color:#1e293b;' +
      'letter-spacing:0;">' + this.leaf(title) + "</p>";
    if (desc) cap += '<p style="margin:5px 14px 13px;font-size:12px;line-height:1.7;color:#64748b;' +
      'letter-spacing:0;">' + this.leaf(desc) + "</p>";
    return '<section style="margin:24px 0;"><section style="border:1px solid #e2e8f0;' +
      'border-radius:12px;overflow:hidden;background:#ffffff;">' + slot + cap + "</section></section>";
  };
  Engine.prototype.defaultFallback = function (b) {
    if (b.role === "video") {
      return this.videoPlaceholder(b);
    }
    if (b.role === "para") {
      var text = (b.bullet ? "• " : "") + (b.fields.text || "");
      return '<section style="margin-top:20px;"><p style="margin:0;font-size:15px;' +
        'line-height:1.95;text-align:justify;color:' + (this.t.TEXT || "#374151") +
        ';letter-spacing:0;">' + this.leaf(text) + "</p></section>";
    }
    var txt = (b.fields.paras || []).join(" ") || b.pos.join(" ");
    return '<section style="margin-top:16px;padding:10px 12px;background:#f8fafc;' +
      'border-radius:8px;"><p style="margin:0;font-size:14px;color:' + (this.t.TEXT || "#374151") +
      ';">' + (txt ? "" : "[" + b.role + "] ") + this.leaf(txt) + "</p></section>";
  };

  /* ---------- 主题注册与解析 ---------- */
  var THEMES = {};
  function registerTheme(theme) { THEMES[theme.THEME.name] = theme; }
  function listThemes() {
    return Object.keys(THEMES).map(function (name) {
      return { name: name, label: THEMES[name].THEME.label || name };
    });
  }
  function getTheme(name) {
    if (THEMES[name]) return THEMES[name];
    var keys = Object.keys(THEMES);
    for (var i = 0; i < keys.length; i++) {
      var th = THEMES[keys[i]];
      if (th.THEME.label === name) return th;
    }
    throw new Error("主题不存在：" + name);
  }

  global.WX = {
    Block: Block, Engine: Engine, parse: parse,
    esc: esc, registerTheme: registerTheme,
    listThemes: listThemes, getTheme: getTheme
  };
})(window);

</script>
<script>
/* ===== inlined: themes/blue-editorial.js ===== */
/* 主题：蓝白杂志（blue-editorial）—— themes/蓝白杂志.py 的 JS 移植 */
(function (global) {
  "use strict";

  var THEME = {
    name: "blue-editorial", label: "蓝白杂志", version: "1.0", containers: [],
    tokens: {
      BLUE: "#2563eb", BLUE_BRIGHT: "#3b82f6", BORDER_BLUE: "#dbeafe",
      INK: "#111827", BOLD_INK: "rgb(17,24,39)", TEXT: "#374151", MUTED: "#9ca3af",
      PAGE_BG: "#ffffff",
      FONT: "'IBM Plex Sans',-apple-system,system-ui,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
    }
  };

  function renderPara(b, c) {
    var t = c.t;
    var text = (b.bullet ? "• " : "") + (b.fields.text || "");
    return '<section style="margin-top:20px;font-family:' + t.FONT + ';">' +
      '<p style="margin:0;font-size:15px;line-height:1.95;text-align:justify;color:' +
      t.TEXT + ';letter-spacing:0;">' + c.leaf(text) + "</p></section>";
  }

  function renderIssue(b, c) {
    var t = c.t;
    var column = b.get(0), date = b.get(1), cover = b.fields.image || "";
    var texts = b.blocks.filter(function (e) {
      return e.type === "para" || e.type === "heading";
    }).map(function (e) { return e.text; });
    var label = texts[0] || "EDITOR'S NOTE";
    var leads = texts.slice(1);
    var leadHtml = leads.map(function (p, j) {
      return '<p style="margin:' + (j < leads.length - 1 ? "0 0 7px" : "0") +
        ';font-size:15px;font-weight:900;line-height:1.7;color:' + t.INK + ';">' +
        c.leaf(p) + "</p>";
    }).join("");

    return '<section style="background:#ffffff;border:1px solid ' + t.BORDER_BLUE +
      ';border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(37,99,235,0.06);">' +
      '<section style="padding:13px 16px 12px;display:flex;align-items:center;gap:8px;">' +
      '<span style="width:7px;height:7px;background:' + t.BLUE +
      ';border-radius:50%;display:inline-block;overflow:hidden;"><span leaf="">&nbsp;</span></span>' +
      '<span style="font-size:9px;font-weight:800;letter-spacing:0;color:' + t.BLUE + ';">' +
      c.leaf(column) + "</span>" +
      '<span style="height:1px;background:linear-gradient(90deg,#bfdbfe,rgba(191,219,254,0));flex:1;display:inline-block;"><span leaf="">&nbsp;</span></span>' +
      '<span style="font-size:9px;font-weight:700;color:' + t.MUTED + ';">' + c.leaf(date) +
      "</span></section>" +
      '<figure style="margin:0;line-height:0;"><span leaf="">' +
      '<img src="' + c.escAttr(cover) +
      '" style="max-width:100%;height:auto;display:block;margin:0 auto;" /></span></figure>' +
      '<section style="padding:15px 17px 17px;background:linear-gradient(135deg,#eff6ff,#ffffff);border-top:1px solid ' +
      t.BORDER_BLUE + ';">' +
      '<p style="margin:0 0 8px;font-size:9px;font-weight:800;letter-spacing:0;color:' + t.BLUE +
      ';">' + c.leaf(label) + "</p>" + leadHtml + "</section></section>";
  }

  function renderPart(b, c) {
    var t = c.t;
    var num = b.get(0), title = b.get(1), en = b.get(2);
    return '<section style="margin-top:60px;font-family:' + t.FONT + ';">' +
      '<section style="display:flex;align-items:center;gap:16px;">' +
      '<section style="text-align:center;flex-shrink:0;">' +
      '<p style="margin:0;font-size:34px;font-weight:800;color:' + t.BLUE +
      ';line-height:1;letter-spacing:0;">' + c.leaf(num) + "</p>" +
      '<p style="margin:3px 0 0;font-size:8px;font-weight:700;color:' + t.MUTED +
      ';letter-spacing:0;">' + c.leaf("PART") + "</p></section>" +
      '<section style="flex:1;min-width:0;">' +
      '<p style="margin:0 0 3px;font-size:22px;font-weight:800;color:' + t.BLUE +
      ';line-height:1.35;letter-spacing:0;word-break:break-word;">' + c.leaf(title) + "</p>" +
      '<p style="margin:0;font-size:10px;font-weight:700;color:' + t.BLUE_BRIGHT +
      ';letter-spacing:0;">' + c.leaf(en.toUpperCase()) + "</p>" +
      "</section></section></section>";
  }

  function renderSub(b, c) {
    var t = c.t, title = b.get(0);
    return '<section style="margin-top:32px;"><p style="margin:0;font-size:16px;font-weight:800;color:' +
      t.BLUE + ';letter-spacing:0;line-height:1.8;">' +
      '<span style="width:4px;height:14px;background:' + t.BLUE +
      ';border-radius:2px;display:inline-block;vertical-align:-2px;margin-right:9px;"></span>' +
      c.leaf(title) + "</p></section>";
  }

  function renderShot(b, c) {
    var t = c.t, src = b.get(0), caption = b.get(1);
    var cap = caption ?
      '<figcaption style="margin-top:9px;font-size:12px;color:' + t.MUTED +
      ';text-align:center;letter-spacing:0;line-height:1.6;">' + c.leaf(caption) + "</figcaption>" : "";
    return '<section style="margin-top:24px;"><figure style="margin:0;">' +
      '<section style="background:#ffffff;border:1px solid ' + t.BORDER_BLUE +
      ';border-radius:12px;padding:6px;overflow:hidden;box-shadow:0 3px 12px rgba(37,99,235,0.06);">' +
      '<span leaf=""><img src="' + c.escAttr(src) +
      '" style="max-width:100%;height:auto;display:block;margin:0 auto;border-radius:8px;" /></span></section>' +
      cap + "</figure></section>";
  }

  function renderQuote(b, c) {
    var t = c.t, who = b.get(0);
    var tag = who ?
      '<p style="margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:0;color:' + t.BLUE +
      ';">' + c.leaf(who) + "</p>" : "";
    var paras = b.fields.paras || [];
    var body = paras.map(function (p, j) {
      return '<p style="margin:' + (j < paras.length - 1 ? "0 0 7px" : "0") +
        ';font-size:14px;line-height:1.85;color:' + t.TEXT + ';letter-spacing:0;">' +
        c.leaf(p) + "</p>";
    }).join("");
    return '<section style="margin-top:20px;padding:12px 14px;background:#f8fafc;border-left:3px solid ' +
      t.BLUE + ';border-radius:0 8px 8px 0;">' + tag + body + "</section>";
  }

  function renderVideo(b, c) {
    // 视频只能在后台从素材库引用、是播放框，无法样式化；统一走内核占位块（虚线框 + 替换提示）。
    return c.videoPlaceholder(b);
  }

  function renderEnd(b, c) {
    var t = c.t;
    return '<section style="margin:26px 4px 22px;display:flex;align-items:center;gap:12px;">' +

  "md": "<!--\n============================================================\n翠绿科技（green-tech）· 主题示例 Demo\n本文逐一演示该主题的全部模块与行内标记；正文均为占位演示文字，可直接替换成你的内容。\n行内标记速查：\n  **词**   绿色加粗（强调）\n  ==词==   绿色加粗 + 黄色 3px 下划线（关键术语）\n  ~~词~~   粉色 2px 下划线（反例 / 风险）\n  ++词++   浅绿 2px 下划线（模型名 / 版本 / 参数）\n  `词`     灰色代码胶囊      @@词@@   琥珀代码胶囊（参考入口）\n  [文字](https://...) 绿色下划线链接\n模块：\n  :::issue 标签|日期|眉题|大标题行1|大标题行2|副说明|横幅文字|胶囊1|胶囊2（容器，空 body，下一行写 :::）\n  :::toc（容器，每行 编号|标题|副标，首张自动激活）\n  :::part 编号|中文标题|英文标签\n  :::sub 小标题\n  :::shot 图片|图注\n  :::note 标题 / :::tip 标题（绿色提示框）   :::warning 标题（琥珀警示框）\n  :::step 编号|标题（容器，可含一行说明，勿嵌套 code）\n  :::code lang=bash（深色终端，逐行原样）\n  :::table（竖线表格）   :::cta（三连卡片）\n============================================================\n-->\n\n<!-- 刊头大封面卡：9 个位置槽，大标题行内可再套行内标记；标签栏是公众号名称，没给就留占位 -->\n:::issue 【请改成你的公众号名称】|【日期】|技术教程 · 演示刊头|一个**示例项目**，|从 0 到 1 跑通全流程|这里是副说明，一句话概括本期演示覆盖了哪些步骤、适合谁看。|示例项目 · 本地可运行 · 全程演示|组件一|组件二\n:::\n\n<!-- 横向滑动目录：每行 编号|标题|副标；首张自动为绿色激活态；末尾用 /// 表示“最后” -->\n:::toc\n01|先搞懂概念|关键术语\n02|能力清单|它能做什么\n03|实测对比|数据与差异\n04|本地跑通|三步上手\n05|接入业务|调用示例\n06|选型避坑|限制与许可\n///|写在最后|先跑通再谈\n:::\n\n<!-- 章节标题：编号 | 中文标题 | 英文标签 -->\n:::part 01|先分清：两种常见做法|CONCEPT A VS B\n\n这一段是正文演示，用来展示行内标记。常见的误区是~~边出边改~~：先蹦出一串结果，后面又把自己推翻，下游很容易出错。\n\n我们要强调的是==append-only==这类关键术语：只追加、不回改。稳定结果一旦提交，后面再来数据也不会推翻前面的结论，用一句话概括就是**落子无悔**。\n\n<!-- 小标题：绿色左竖条 -->\n:::sub 一张表看懂差异\n\n<!-- 竖线表格：首行为表头，第二行分隔线可省略；首列自动浅绿底 -->\n:::table\n| 维度 | 做法 A（可回改） | 做法 B（只追加） |\n| --- | --- | --- |\n| 已出结果 | 可能被改写 | 永久提交 |\n| 观感 | 容易闪烁 | 更稳定 |\n| 下游消费 | 动作可能被推翻 | 可立刻使用 |\n| 接入成本 | 需额外处理 | 链路更简单 |\n:::\n\n<!-- 琥珀警示框：首段位置槽=标题，其后为正文 -->\n:::warning 读表注意\n带 ※ 的项目只是演示数据，不代表真实结论；正式对比请以你自己的实测为准，这里仅展示表格与警示框的写法。\n:::\n\n<!-- 绿色提示框 tip（note / tip 同为绿色，tip 偏“推荐做法”，warning 为琥珀） -->\n:::tip 怎么快速判断\n盯结果 10 秒：如果已经出现的内容又被「回头改掉」，就是会回改的做法；只追加、不回改的才是稳定做法。\n:::\n\n:::part 04|本地三步跑通|QUICK START\n\n演示环境建议用隔离的虚拟环境，Python 版本以++3.12++为例（3.10+ 一般也可用）。想少踩依赖兼容坑，直接用 **Docker** 更省事，镜像名可写成 `your-name/demo:latest` 这样的占位。\n\n<!-- 步骤：编号 | 标题；容器内可放一行说明，代码块请放在 ::: 之后，不要嵌套 -->\n:::step 01|拉代码、建环境\n先克隆示例仓库，再建一个干净的虚拟环境，避免污染本机依赖。\n:::\n\n<!-- 深色终端代码块：lang 指定语言，正文逐行原样保留 -->\n:::code lang=bash\ngit clone https://example.com/your-name/demo-project.git\ncd demo-project\nconda create -n demo python=3.12 -y\nconda activate demo\npip install -e .\n:::\n\n:::step 02|准备输入，跑通一次\n准备一个示例输入文件，程序内部会自动做格式校验；下面的路径都换成你自己的。\n:::\n\n:::code lang=bash\n./run_example.sh /path/to/input.wav \\\n  --model_path /path/to/demo-model \\\n  --mode stream \\\n  --language Chinese\n:::\n\n:::step 03|监听输出，确认稳定\n监听流式输出，确认已提交的结果不再回改，再接你自己的业务逻辑。\n:::\n\n<!-- 居中截图：图片 https 地址 | 图注（可留空）；正式使用时换成你的截图，必须 https -->\n:::shot https://placehold.co/800x520/f0fdf4/059669?text=Screenshot|运行成功后的终端输出（占位图，替换成你的截图）\n\n<!-- 绿色提示框 -->\n:::note 一句话小结\n先把基础流程跑稳，再逐步叠加更多功能，顺序别反。\n:::\n\n:::part ///|写在最后|WRAP UP\n\n这段结尾演示**加粗**、行内代码 `run_example.sh`、琥珀胶囊入口 @@demo-project@@、@@参考文档@@，以及一个绿色下划线链接，完整写法可以看[官方文档占位](https://example.com)。\n\n建议你今晚就干一件事：把示例跑起来，确认能稳定输出，再考虑接入完整链路。别一上来就上生产。\n\n我是【作者名】，热衷于分享技术实践与干货。你更想拿它做什么？评论区聊。\n\n<!-- 三连卡片：正文为引导语；三个按钮为简化样式（原文为 SVG 图标） -->\n:::cta\n既然看到这里了，如果觉得有用，随手点个赞、在看、转发三连吧。\n:::\n"

<script>
(function () {
  var editor = document.getElementById("editor");
  var preview = document.getElementById("preview");
  var statusEl = document.getElementById("status");
  var themeSel = document.getElementById("themeSel");
  var sampleSel = document.getElementById("sampleSel");
  var copySrc = document.getElementById("copySrc");
  var lastHtml = "";

  /* 填充主题下拉 */
  WX.listThemes().forEach(function (t) {
    var o = document.createElement("option");
    o.value = t.name; o.textContent = t.label;
    themeSel.appendChild(o);
  });

  /* 填充示例下拉 */
  WX_SAMPLES.forEach(function (s, i) {
    var o = document.createElement("option");
    o.value = String(i); o.textContent = s.label;
    sampleSel.appendChild(o);
  });

  function currentEngine() {
    var theme = WX.getTheme(themeSel.value);
    return new WX.Engine(theme);
  }

  function render() {
    var md = editor.value;
    var html;
    try {
      html = currentEngine().render(md);
    } catch (e) {
      statusEl.textContent = "渲染出错：" + e.message;
      return;
    }
    lastHtml = html;
    copySrc.innerHTML = html;
    var leaves = (html.match(/leaf=""/g) || []).length;
    var imgs = (html.match(/<img /g) || []).length;
    var doc = '<!DOCTYPE html><html><head><meta charset="utf-8"></head>' +
      '<body style="margin:0;background:#f1f3f6;padding:18px 0;">' + html + "</body></html>";
    preview.srcdoc = doc;
    statusEl.textContent = "已渲染 · leaf " + leaves + " · 图片 " + imgs;
  }

  var timer = null;
  function scheduleRender() {
    clearTimeout(timer);
    timer = setTimeout(render, 350);
  }

  function copyArticle() {
    var node = copySrc.firstChild;
    if (!node) { render(); node = copySrc.firstChild; }
    function report(ok, msg) {
      statusEl.textContent = msg;
    }
    if (navigator.clipboard && window.ClipboardItem) {
      var data = [new ClipboardItem({
        "text/html": new Blob([copySrc.innerHTML], { type: "text/html" }),
        "text/plain": new Blob([copySrc.innerText || ""], { type: "text/plain" })
      })];
      navigator.clipboard.write(data).then(function () {
        report(true, "已复制（富文本），可到公众号后台 Ctrl+V");
      }, function () { fallbackCopy(); });
    } else fallbackCopy();

    function fallbackCopy() {
      var range = document.createRange();
      range.selectNodeContents(copySrc);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try {
        if (document.execCommand("copy"))
          report(true, "已复制（兼容模式），可到公众号后台 Ctrl+V");
        else report(false, "复制失败，请手动全选复制");
      } catch (e) { report(false, "复制失败：" + e.message); }
      sel.removeAllRanges();
    }
  }

  function downloadHtml() {
    var html = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n' +
      '<title>排版预览</title>\n</head>\n<body style="margin:0;background:#f1f3f6;padding:18px 0;">\n' +
      lastHtml + "\n</body>\n</html>";
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "排版预览.html";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    statusEl.textContent = "已下载 HTML";
  }

  /* 事件 */
  editor.addEventListener("input", scheduleRender);
  themeSel.addEventListener("change", render);
  document.getElementById("renderBtn").addEventListener("click", render);
  document.getElementById("copyBtn").addEventListener("click", copyArticle);
  document.getElementById("downloadBtn").addEventListener("click", downloadHtml);
  sampleSel.addEventListener("change", function () {
    var s = WX_SAMPLES[Number(sampleSel.value)];
    editor.value = s.md;
    /* 尽量切到与示例匹配的主题 */
    var map = { "蓝白": "blue-editorial", "暖橙": "warm-horizontal",
                "暖棕": "warm-brown-journal", "翠绿": "green-tech" };
    Object.keys(map).forEach(function (k) {
      if (s.label.indexOf(k) >= 0) themeSel.value = map[k];
    });
    render();
  });

  /* 初始：载入共享示例 */
  editor.value = WX_SAMPLES[0].md;
  render();
})();
</script>
</body>
</html>
